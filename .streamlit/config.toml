[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F8"
textColor = "#18181B"
linkColor = "#4F46E5"
borderColor = "#E7E7EC"
dataframeBorderColor = "#EEEEF2"
dataframeHeaderBackgroundColor = "#F7F7FA"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFontWeights = [700, 650, 600]
baseFontSize = 14
metricValueFontSize = "1.6rem"
metricValueFontWeight = 650
greenColor = "#16A34A"
redColor = "#DC2626"
chartCategoricalColors = ["#4F46E5", "#A5B4FC", "#16A34A", "#F59E0B", "#DC2626"]

[theme.sidebar]
backgroundColor = "#FAFAFB"
secondaryBackgroundColor = "#FFFFFF"
