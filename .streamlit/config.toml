# INTRINSIC — dark research workspace. Tokens mirror intrinsic/ui/theme.py (keep both in sync).
[theme]
base = "dark"
primaryColor = "#5CCFBF"
backgroundColor = "#0B0E13"
secondaryBackgroundColor = "#121821"
textColor = "#E7EBF0"
linkColor = "#5CCFBF"
borderColor = "#232C38"
dataframeBorderColor = "#1E2631"
dataframeHeaderBackgroundColor = "#121821"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontWeights = [600, 600, 600]
baseFontSize = 14
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600
greenColor = "#4BCB8B"
redColor = "#F2707B"
orangeColor = "#F0B04A"
yellowColor = "#F0B04A"
blueColor = "#8E9CF5"
chartCategoricalColors = ["#5CCFBF", "#D9976A", "#8E9CF5", "#B9A6FF", "#9BA6B5"]

[theme.sidebar]
backgroundColor = "#0E1218"
secondaryBackgroundColor = "#141B24"
borderColor = "#1E2631"
